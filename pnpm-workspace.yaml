packages:
  - "."
  - "examples/*"

# Nest 12.0.0-alpha.* still declares ^11.0.0 peers on its own siblings.
peerDependencyRules:
  allowedVersions:
    "@nestjs/common": "12"
    "@nestjs/core": "12"
    "@nestjs/platform-express": "12"
    "@nestjs/platform-fastify": "12"

# @nestjs/core's postinstall is only a donation banner; never run it.
allowBuilds:
  "@nestjs/core": false
  "@swc/core": false
  cbor-extract: false
  esbuild: false

# `changeset publish` delegates to pnpm. A failed OIDC attestation must fail
# the release rather than silently publishing without provenance.
provenance: true

minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.41"
  - "@ai-sdk/provider-utils@5.0.21"
  - ai@7.0.52
